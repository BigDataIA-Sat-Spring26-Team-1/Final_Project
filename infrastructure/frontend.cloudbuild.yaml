# Cloud Build pipeline for the CurateAI frontend Cloud Run service.
#
# Usage (from repo root):
#   gcloud builds submit \
#     --config=infrastructure/frontend.cloudbuild.yaml \
#     --substitutions=_BACKEND_URL=https://curateai-backend-XXXXX-uc.a.run.app \
#     .
#
# The backend URL MUST be passed as a substitution — Next.js inlines
# NEXT_PUBLIC_API_URL into the client bundle at build time, so changing
# backends requires a fresh image. Everything else has sane defaults.

substitutions:
  _REGION: us-central1
  _REPO: curateai
  _SERVICE: curateai-frontend
  _RUNTIME_SA: curateai-frontend-sa@gen-lang-client-0720834968.iam.gserviceaccount.com

  # Points at the backend Cloud Run service URL with no trailing slash.
  # Baked into the client bundle at build time (Next.js inlines every
  # NEXT_PUBLIC_* var during `next build`) AND set as a runtime env on the
  # Cloud Run service for debugging. Override per environment with
  # `--substitutions=_BACKEND_URL=https://your-backend…run.app` when
  # deploying against a non-prod backend.
  _BACKEND_URL: https://curateai-backend-sjhg7huf4q-uc.a.run.app

steps:
  # 1) Build with layer cache. The build arg surfaces the backend URL to
  #    Next.js so `next build` inlines it into the client bundle.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend"
        docker pull "$${IMAGE}:latest" || true
        docker build \
          --cache-from "$${IMAGE}:latest" \
          --build-arg NEXT_PUBLIC_API_URL=${_BACKEND_URL} \
          -t "$${IMAGE}:latest" \
          -t "$${IMAGE}:$BUILD_ID" \
          -f frontend/Dockerfile \
          frontend

  # 2) Push both tags so we can roll back by $BUILD_ID later if needed.
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend"
        docker push "$${IMAGE}:latest"
        docker push "$${IMAGE}:$BUILD_ID"

  # 3) Deploy. No secrets needed — the frontend is a static-ish Next.js app
  #    and the backend URL is already baked into the bundle. Still worth
  #    exposing NEXT_PUBLIC_API_URL at runtime for debugging (e.g. curl'ing
  #    the container and reading env vars).
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --service-account=${_RUNTIME_SA}
      - --port=8080
      - --allow-unauthenticated
      - --cpu=1
      - --memory=512Mi
      - --cpu-boost
      - --min-instances=0
      - --max-instances=5
      - --concurrency=80
      - --set-env-vars=NODE_ENV=production,NEXT_PUBLIC_API_URL=${_BACKEND_URL}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$BUILD_ID

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
