# Combined build: backend first, then frontend with the backend URL baked in.
#
# Useful when the backend URL hasn't been stood up yet and you want a single
# pipeline that provisions both. For incremental deploys run the per-service
# cloudbuild files directly (backend.cloudbuild.yaml / frontend.cloudbuild.yaml).
steps:
  # ---------------- backend ----------------
  - id: backend-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/${PROJECT_ID}/curateai/backend:${SHORT_SHA}
      - -t
      - us-central1-docker.pkg.dev/${PROJECT_ID}/curateai/backend:latest
      - backend

  - id: backend-push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, us-central1-docker.pkg.dev/${PROJECT_ID}/curateai/backend]
    waitFor: [backend-build]

  - id: backend-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy curateai-backend \
          --image us-central1-docker.pkg.dev/${PROJECT_ID}/curateai/backend:${SHORT_SHA} \
          --region us-central1 \
          --service-account curateai-backend-sa@${PROJECT_ID}.iam.gserviceaccount.com \
          --allow-unauthenticated
    waitFor: [backend-push]

  # ---------------- frontend ----------------
  # Fetches the backend URL from the freshly-deployed service so the first-ever
  # combined run doesn't need `_BACKEND_URL` substitution hand-wired.
  - id: backend-url-probe
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe curateai-backend \
          --region us-central1 \
          --format='value(status.url)' > /workspace/backend_url.txt
        cat /workspace/backend_url.txt
    waitFor: [backend-deploy]

  - id: frontend-build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=$$BACKEND_URL \
          -t us-central1-docker.pkg.dev/${PROJECT_ID}/curateai/frontend:${SHORT_SHA} \
          -t us-central1-docker.pkg.dev/${PROJECT_ID}/curateai/frontend:latest \
          frontend
    waitFor: [backend-url-probe]

  - id: frontend-push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, us-central1-docker.pkg.dev/${PROJECT_ID}/curateai/frontend]
    waitFor: [frontend-build]

  - id: frontend-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy curateai-frontend \
          --image us-central1-docker.pkg.dev/${PROJECT_ID}/curateai/frontend:${SHORT_SHA} \
          --region us-central1 \
          --allow-unauthenticated
    waitFor: [frontend-push]

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
