name: Build

on:
  push:
    branches: [main, Abhinav]
  pull_request:
    branches: [main]

# Build-only workflow: the `push: false` steps below mean we never actually
# ship these images anywhere, so the tag is purely a local buildx label.
# Using a plain "curateai/..." tag keeps the workflow green even when
# GCP_PROJECT_ID isn't configured as a repo secret — which is the case on
# this repo today because deploys go through Cloud Build, not GitHub Actions.
env:
  BACKEND_IMAGE: curateai-backend
  AIRFLOW_IMAGE: curateai-airflow

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-airflow:
    name: Build Airflow Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build airflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./airflow/Dockerfile
          push: false
          tags: ${{ env.AIRFLOW_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max