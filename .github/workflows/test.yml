name: test

on:
  pull_request:
  push:
    branches: [main, Aakash]

jobs:
  backend-unit:
    name: backend · pytest (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Unit tests stub out Snowflake + OpenAI, so we don't need real secrets.
    # The placeholder env vars are there purely so ``app.core.config.Settings``
    # doesn't refuse to import under pydantic-settings.
    env:
      SECRET_KEY: ci-placeholder
      SNOWFLAKE_ACCOUNT: test
      SNOWFLAKE_USER: test
      SNOWFLAKE_PASSWORD: test
      SNOWFLAKE_DATABASE: test
      SNOWFLAKE_SCHEMA: test
      SNOWFLAKE_WAREHOUSE: test
      SNOWFLAKE_ROLE: test
      OPENAI_API_KEY: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Run pytest (unit suite only)
        run: uv run --no-sync pytest tests/unit -q

  frontend-unit:
    name: frontend · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run vitest
        run: npm test -- --run

  dags-parse:
    name: airflow · parse DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check every DAG file
        # We don't install airflow here — the DAGs import airflow at runtime
        # only. A plain AST parse is enough to catch typos that would crash
        # the scheduler on deploy.
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          failed = []
          for p in pathlib.Path("airflow/dags").glob("*.py"):
              try:
                  ast.parse(p.read_text())
                  print(f"OK   {p.name}")
              except SyntaxError as exc:
                  print(f"FAIL {p.name}: {exc}")
                  failed.append(p.name)
          sys.exit(1 if failed else 0)
          PY
