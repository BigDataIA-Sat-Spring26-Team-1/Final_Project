name: lint

# Trigger on every PR and every push to main/Aakash so a regression is caught
# before Cloud Build or the Airflow VM ever see the code.
on:
  pull_request:
  push:
    branches: [main, Aakash]

jobs:
  backend:
    name: backend · ruff + compile check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # `uv sync` installs the locked dev env; --frozen guarantees CI matches
        # the committed uv.lock instead of silently resolving fresh.
        run: uv sync --frozen --extra test

      - name: Ruff (style + import order)
        run: uv run --no-sync ruff check app tests || echo "ruff not pinned yet — non-blocking"
        continue-on-error: true

      - name: Compile-check the package
        # A cheap smoke test that catches syntax errors across every module.
        run: uv run --no-sync python -m compileall -q app

  frontend:
    name: frontend · eslint + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint --if-present
