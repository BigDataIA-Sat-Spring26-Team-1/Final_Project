[project]
name = "curateai-backend"
version = "1.0.0"
description = "CurateAI Intelligence API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "snowflake-connector-python>=3.10.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "python-multipart>=0.0.24",
    "litellm>=1.83.4",
    "pdfplumber>=0.11.4",
    "pypdf>=6.9.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
