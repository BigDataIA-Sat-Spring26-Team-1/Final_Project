[project]
name = "curateai-backend"
version = "1.0.0"
description = "CurateAI Intelligence API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.11.0,<3.0",
    "pydantic-settings>=2.2.1",
    "snowflake-connector-python>=3.10.0",
    "python-dotenv==1.0.1",
    "structlog>=24.1.0",
    "python-multipart>=0.0.24",
    "litellm>=1.83.4",
    "pdfplumber>=0.11.4",
    "pypdf>=6.9.2",
    "slowapi>=0.1.9",
    "tenacity>=9.1.4",
    "feedparser>=6.0.12",
    "python-dateutil>=2.9.0.post0",
    "scikit-learn>=1.7.2",
    "numpy>=2.2.6",
    "trafilatura>=2.0.0",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "qdrant-client>=1.17.1",
    "langgraph>=0.2.0,<0.3.0",
    "langchain-core>=0.3.0,<0.4.0",
    "prometheus-client>=0.21.0",
    "mcp[fastapi]>=1.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]